<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Used GPU Market: AI Accelerators</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        th.sortable:hover { background-color: rgba(255, 255, 255, 0.05); cursor: pointer; }
        .non-tensor { opacity: 0.5; grayscale(100%); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">
    <div class="max-w-7xl w-full space-y-6">
        <header class="text-center space-y-2 mb-8">
            <h1 class="text-3xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-emerald-400 to-teal-500">
                AI Accelerator GPU Market
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Current Second-Hand Pricing & Memory Bandwidth Metrics (Verified May 2026)</p>
        </header>

        <div class="glass-panel rounded-2xl p-4 md:p-6 shadow-2xl">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-6 w-full">
                <h2 class="text-xl font-semibold flex items-center gap-2 whitespace-nowrap">
                    <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Market Visualization
                </h2>
                <div class="flex-1 w-full max-w-md px-4">
                    <label for="bandwidthFilter" class="text-sm font-medium text-slate-300 flex justify-between mb-2">
                        <span>Minimum Bandwidth:</span>
                        <span id="bandwidthValue" class="text-emerald-400 font-mono">688 GB/s</span>
                    </label>
                    <input type="range" id="bandwidthFilter" min="0" max="1600" step="16" value="688" 
                        class="w-full accent-emerald-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer"
                        oninput="handleFilterChange(this.value)">
                </div>
                <div class="flex flex-wrap gap-2 text-sm shrink-0">
                    <button onclick="handleSort('bandwidth', true)" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors">Sort by Bandwidth</button>
                    <button onclick="handleSort('price', false)" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors">Sort by Price</button>
                    <button onclick="handleSort('value', true)" class="px-4 py-2 rounded-lg bg-emerald-900/50 hover:bg-emerald-800/50 border border-emerald-700 transition-colors text-emerald-100">Sort by Value</button>
                </div>
            </div>
            <div class="relative h-[600px] md:h-[800px] w-full">
                <canvas id="gpuChart"></canvas>
            </div>
        </div>

        <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead style="background: #1e293b; color: #fff;">
                        <tr class="text-slate-300 text-sm uppercase tracking-wider border-b border-slate-700">
                            <th class="p-4 font-medium" style="color: #fff;">Model</th>
                            <th class="p-4 font-medium" style="color: #fff;">Type</th>
                            <th class="p-4 font-medium sortable" style="color: #fff;" onclick="handleSort('vram')">VRAM (GB) ↕</th>
                            <th class="p-4 font-medium sortable" style="color: #fff;" onclick="handleSort('bandwidth')">Bandwidth (GB/s) ↕</th>
                            <th class="p-4 font-medium sortable" style="color: #fff;" onclick="handleSort('price')">Used Price ($) ↕</th>
                            <th class="p-4 font-medium sortable" style="color: #fff;" onclick="handleSort('value')">Value ↕</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800 text-sm md:text-base"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const gpuData = [
            { m: "RTX 5090 32GB", brand: "NVIDIA", type: "Tensor", vram: 32, bandwidth: 1536, price: 2200, tensor: true },
            { m: "RTX 4090 24GB", brand: "NVIDIA", type: "Tensor", vram: 24, bandwidth: 1008, price: 1600, tensor: true },
            { m: "RTX 6000 Ada 48GB", brand: "NVIDIA", type: "Pro", vram: 48, bandwidth: 960, price: 6800, tensor: true },
            { m: "RTX A6000 48GB", brand: "NVIDIA", type: "Pro", vram: 48, bandwidth: 768, price: 2800, tensor: true },
            { m: "Radeon VII 16GB", brand: "AMD", type: "HBM2", vram: 16, bandwidth: 1024, price: 350, tensor: false },
            { m: "Tesla V100 32GB", brand: "NVIDIA", type: "HBM2", vram: 32, bandwidth: 900, price: 500, tensor: false },
            { m: "RTX 3090 Ti 24GB", brand: "NVIDIA", type: "Tensor", vram: 24, bandwidth: 1008, price: 1050, tensor: true },
            { m: "RTX 3090 24GB", brand: "NVIDIA", type: "Tensor", vram: 24, bandwidth: 936, price: 950, tensor: true },
            { m: "RX 7900 XTX 24GB", brand: "AMD", type: "Matrix", vram: 24, bandwidth: 960, price: 850, tensor: true },
            { m: "RX 7900 XT 20GB", brand: "AMD", type: "Matrix", vram: 20, bandwidth: 800, price: 720, tensor: true },
            { m: "RX 7900 GRE 16GB", brand: "AMD", type: "Matrix", vram: 16, bandwidth: 576, price: 550, tensor: true },
            { m: "RX 7800 XT 16GB", brand: "AMD", type: "Matrix", vram: 16, bandwidth: 624, price: 450, tensor: true },
            { m: "Arc A770 16GB", brand: "INTEL", type: "XMX", vram: 16, bandwidth: 512, price: 350, tensor: true },
            { m: "Tesla P40 24GB", brand: "NVIDIA", type: "Legacy", vram: 24, bandwidth: 346, price: 150, tensor: false },
            { m: "Arc B770 16GB", brand: "INTEL", type: "XMX", vram: 16, bandwidth: 600, price: 450, tensor: true },
            { m: "RTX 2080 Ti 11GB", brand: "NVIDIA", type: "Tensor", vram: 11, bandwidth: 616, price: 300, tensor: true },
            { m: "Mac Studio M2U 192GB", brand: "INTEL", type: "UMA", vram: 192, bandwidth: 800, price: 4500, tensor: true }
        ];

        gpuData.forEach(gpu => { gpu.value = (gpu.bandwidth / gpu.price).toFixed(2); });

        const brandColors = {
            "NVIDIA": { bg: "rgba(118, 185, 0, 0.8)", border: "#76b900", badge: "bg-green-900/40 text-green-400 border-green-800" },
            "AMD": { bg: "rgba(237, 28, 36, 0.8)", border: "#ed1c24", badge: "bg-red-900/40 text-red-400 border-red-800" },
            "INTEL": { bg: "rgba(0, 113, 197, 0.8)", border: "#0071c5", badge: "bg-blue-900/40 text-blue-400 border-blue-800" }
        };

        let currentSort = { column: 'bandwidth', desc: true };
        let chartInstance = null;
        let filteredGpuData = [];
        let minBandwidthFilter = 688;

        function handleFilterChange(value) {
            minBandwidthFilter = parseInt(value, 10);
            document.getElementById('bandwidthValue').textContent = minBandwidthFilter + ' GB/s';
            applyFiltersAndSort();
        }

        function handleSort(column, forceDesc = null) {
            if (forceDesc !== null) { currentSort.desc = forceDesc; } 
            else { if (currentSort.column === column) { currentSort.desc = !currentSort.desc; } else { currentSort.column = column; currentSort.desc = true; } }
            applyFiltersAndSort();
        }

        function applyFiltersAndSort() {
            filteredGpuData = gpuData.filter(gpu => gpu.bandwidth >= minBandwidthFilter);
            filteredGpuData.sort((a, b) => {
                let valA = parseFloat(a[currentSort.column]) || a[currentSort.column];
                let valB = parseFloat(b[currentSort.column]) || b[currentSort.column];
                if (valA < valB) return currentSort.desc ? 1 : -1;
                if (valA > valB) return currentSort.desc ? -1 : 1;
                return 0;
            });
            renderTable();
            updateChart();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            filteredGpuData.forEach(gpu => {
                const tr = document.createElement('tr');
                tr.className = `hover:bg-slate-800/50 transition-colors group ${gpu.tensor ? '' : 'opacity-50 grayscale'}`;
                const badgeClass = brandColors[gpu.brand].badge;
                tr.innerHTML = `
                    <td class="p-4 flex items-center gap-3">
                        <div class="w-2 h-8 rounded-full" style="background-color: ${brandColors[gpu.brand].border}"></div>
                        <div class="font-semibold text-slate-100">${gpu.m} ${gpu.tensor ? '' : '<br><small class="text-slate-500">No Tensors</small>'}</div>
                    </td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-md text-xs border ${badgeClass}">${gpu.brand} ${gpu.type}</span></td>
                    <td class="p-4 font-medium text-slate-300">${gpu.vram} GB</td>
                    <td class="p-4 font-mono text-emerald-400">${gpu.bandwidth}</td>
                    <td class="p-4 font-mono text-rose-300">$${gpu.price}</td>
                    <td class="p-4 font-mono text-teal-300">${gpu.value}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function initChart() {
            const ctx = document.getElementById('gpuChart').getContext('2d');
            Chart.defaults.color = '#94a3b8';
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: getChartData(),
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    scales: {
                        xBandwidth: { type: 'linear', position: 'bottom', title: { display: true, text: 'BW (GB/s)', color: '#34d399' } },
                        xPrice: { type: 'linear', position: 'top', title: { display: true, text: 'Price (USD)', color: '#fca5a5' }, grid: { drawOnChartArea: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function getChartData() {
            return {
                labels: filteredGpuData.map(g => g.m),
                datasets: [
                    { label: 'BW (GB/s)', data: filteredGpuData.map(g => g.bandwidth), backgroundColor: filteredGpuData.map(g => g.tensor ? brandColors[g.brand].bg : 'rgba(71, 85, 105, 0.8)'), borderColor: filteredGpuData.map(g => brandColors[g.brand].border), borderWidth: 1, xAxisID: 'xBandwidth' },
                    { label: 'Price ($)', data: filteredGpuData.map(g => g.price), backgroundColor: 'rgba(244, 63, 94, 0.2)', borderColor: 'rgba(244, 63, 94, 0.8)', borderWidth: 1, xAxisID: 'xPrice' }
                ]
            };
        }

        function updateChart() { if (chartInstance) { chartInstance.data = getChartData(); chartInstance.update(); } }
        window.onload = () => { applyFiltersAndSort(); initChart(); };
    </script>
</body>
</html>
