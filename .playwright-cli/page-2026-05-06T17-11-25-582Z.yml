                      - separator [ref=f305e24]
                      - heading "Beschreibung" [level=1] [ref=f305e25]
                      - paragraph [ref=f305e26]:
                        - text: Die
                        - strong [ref=f305e27]: NVIDIA Tesla P40
                        - text: ist ein leistungsstarker GPU-Beschleuniger auf Basis der
                        - strong [ref=f305e28]: Pascal-Architektur
                        - text: und wurde speziell für moderne
                        - strong [ref=f305e29]: KI-, Deep-Learning- und Inference-Anwendungen
                        - text: entwickelt. Sie bietet eine hohe Rechenleistung für Rechenzentren, Workstations und Serverumgebungen, in denen große Datenmengen schnell verarbeitet werden müssen.
                      - paragraph [ref=f305e30]:
                        - text: Die Tesla P40 wurde insbesondere für
                        - strong [ref=f305e31]: Inference-Aufgaben
                        - text: optimiert. Dazu gehören Anwendungen wie
                        - strong [ref=f305e32]: Bild- und Spracherkennung
                        - text: ","
                        - strong [ref=f305e33]: Produktempfehlungen
                        - text: ","
                        - strong [ref=f305e34]: E-Mail-Filterung
                        - text: ","
                        - strong [ref=f305e35]: Videoanalyse
                        - text: sowie andere KI-gestützte Dienste, die in Echtzeit auf Nutzereingaben reagieren müssen. Im Vergleich zu klassischen CPU-Lösungen kann die Tesla P40 die Verarbeitung deutlich beschleunigen und so eine wesentlich bessere Effizienz und geringere Antwortzeiten ermöglichen.
                      - paragraph [ref=f305e36]:
                        - text: Dank der
                        - strong [ref=f305e37]: Pascal GP102 GPU
                        - text: verfügt die Tesla P40 über
                        - strong [ref=f305e38]: 3840 CUDA-Kerne
                        - text: und
                        - strong [ref=f305e39]: 24 GB GDDR5-Speicher
                        - text: . Mit einer
                        - strong [ref=f305e40]: Speicherbandbreite von 346 GB/s
                        - text: und einem
                        - strong [ref=f305e41]: 384-bit Speicherinterface
                        - text: eignet sich die Karte hervorragend für rechenintensive Workloads. Die GPU erreicht bis zu
                        - strong [ref=f305e42]: 12 TFLOPS FP32-Leistung
                        - text: sowie bis zu
                        - strong [ref=f305e43]: 47 TOPS bei INT8-Operationen
                        - text: und ist damit ideal für moderne Inferenz-Workloads im professionellen Einsatz.
                      - paragraph [ref=f305e44]:
                        - text: Die Karte besitzt ein
                        - strong [ref=f305e45]: passives Kühldesign
                        - text: und ist für den Einsatz in Systemen mit geeignetem Airflow konzipiert. Durch den
                        - strong [ref=f305e46]: PCI-Express 3.0 x16
                        - text: Anschluss lässt sie sich in kompatible Server- und Workstation-Systeme integrieren.
                      - paragraph [ref=f305e47]:
                        - text: "Hinweis: Wenn kein Server-Mainboard verwendet wird, muss unter Umständen im BIOS die Option"
                        - strong [ref=f305e48]: „Above 4G Decoding“
                        - text: aktiviert werden, bevor die GPU installiert wird.
